name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run unit and integration tests
        run: npm test

      - name: Generate ecosystem eval scorecard
        run: |
          node ./dist/cli.js --suite all --out-json scorecard.json --out-md scorecard.md --fail-on-case-failure
          cat scorecard.md >> "$GITHUB_STEP_SUMMARY"
